name: Build belttentiontest only

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: belttentiontest

    steps:
    # The WPF project references ..\..\MonoXR relative to its own folder (and the solution
    # references ..\MonoXR), so both repos must sit side by side in the workspace:
    #   <workspace>\belttentiontest   (this repo)
    #   <workspace>\MonoXR            (sibling repo)
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: belttentiontest

    - name: Checkout MonoXR (sibling repo)
      uses: actions/checkout@v4
      with:
        repository: Mattlekim/MonoXR
        path: MonoXR

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore belttentiontest
      run: dotnet restore ./belttentiontest/belttentiontest.csproj

    - name: Build belttentiontest
      run: dotnet build --configuration Release ./belttentiontest/belttentiontest.csproj --no-restore
