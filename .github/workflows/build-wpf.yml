name: Build WPF App (versioned)

# Builds and releases BeltTensionTest.WPF on every push to master.
# Version = <version.txt major.minor>.<run number>, so every build gets a new,
# higher number. That number is stamped into the exe and used as the GitHub
# release tag (v<version>); the in-app updater installs from that release.
# Bump version.txt to change major/minor. Can also be run manually.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022 # VS 2022 needed by the MonoXR CMake generator
    permissions:
      contents: write

    steps:
      # The WPF project references ..\..\MonoXR relative to its own folder,
      # so both repos must sit side by side in the workspace:
      #   <workspace>\belttentiontest   (this repo)
      #   <workspace>\MonoXR            (sibling repo)
      - name: Checkout BeltTentioner
        uses: actions/checkout@v4
        with:
          path: belttentiontest
          fetch-depth: 0

      - name: Checkout MonoXR (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: Mattlekim/MonoXR
          path: MonoXR

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $base = (Get-Content belttentiontest/version.txt -Raw).Trim()
          if ($base -notmatch '^\d+\.\d+$') {
            Write-Error "version.txt must contain Major.Minor (e.g. 2.1), found '$base'"
            exit 1
          }
          $v = "$base.$env:GITHUB_RUN_NUMBER"
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT
          echo "NUMERIC=$v" >> $env:GITHUB_OUTPUT
          echo "Building version: $v"

      # Release notes shown in the app's update window: commits since the
      # previous release tag.
      - name: Build release notes
        id: notes
        shell: pwsh
        working-directory: belttentiontest
        run: |
          $prev = git describe --tags --abbrev=0 2>$null
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD" }
          $lines = git log $range --no-merges --pretty=format:"- %s" | Select-Object -First 50
          if (-not $lines) { $lines = "- Maintenance build" }
          $lines -join "`n" | Out-File -FilePath ../release-notes.md -Encoding utf8

      # dotnet publish also builds the native MonoXR OpenXR layer via the
      # csproj's CMake target (VS2022 + CMake are on windows-latest).
      # Settings mirror Properties/PublishProfiles/FolderProfile.pubxml.
      - name: Publish WPF app
        run: >
          dotnet publish belttentiontest/BeltTensionTest.WPF/BeltTensionTest.WPF.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.VERSION }}
          -p:AssemblyVersion=${{ steps.version.outputs.NUMERIC }}
          -p:FileVersion=${{ steps.version.outputs.NUMERIC }}
          --output ./publish

      - name: Create ZIP archive
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath BeltTensioner-v${{ steps.version.outputs.VERSION }}-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeltTensioner-v${{ steps.version.outputs.VERSION }}
          path: ./publish
          retention-days: 30

      - name: Create GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          name: BeltTensioner v${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          files: BeltTensioner-v${{ steps.version.outputs.VERSION }}-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
